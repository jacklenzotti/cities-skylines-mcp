[project]
name = "cs1-mcp"
version = "0.1.0"
description = "MCP server for Cities: Skylines (CS1) — drives the game via the CS1 MCP Bridge mod"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Lenzotti" }]
keywords = ["mcp", "cities-skylines", "modding", "fastmcp"]
dependencies = ["fastmcp>=3.0"]

[project.scripts]
cs1-mcp = "cs1_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs1_mcp"]
